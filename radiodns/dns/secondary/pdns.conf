# PowerDNS Authoritative 4.9 — public secondary (ns1-ns11)
#
# Receives zone data from the hidden master via TSIG-authenticated AXFR/IXFR.
# PowerDNS API is DISABLED — these nodes expose 53/udp and 53/tcp only.
# DNSSEC records are served as received from the primary (pre-signed transfer).

launch=lmdb
lmdb-filename=/var/lib/powerdns/pdns.lmdb

# Role: secondary only
secondary=yes
primary=no

# API disabled on all public NS nodes
api=no
webserver=no

# Zone transfer polling interval (seconds)
slave-cycle-interval=60

# DNS listeners — 53 only
local-address=0.0.0.0
local-port=53
reuseport=yes

# Performance
receiver-threads=2
distributor-threads=2

# Logging
loglevel=4
log-dns-queries=no
log-dns-details=no
query-logging=no
