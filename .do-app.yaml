name: genoa-splat-sidecar
region: nyc
services:
  - name: web
    environment_slug: docker
    source_dir: .
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /healthz
    envs:
      - key: GENOA_HOST
        value: 0.0.0.0
      - key: GENOA_PORT
        value: "8080"
      - key: SPLAT_BIN
        value: /app/splat
      - key: SPLAT_WORKDIR
        value: /app/work
