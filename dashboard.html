<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Genoa Sidecar Dashboard</title>
<style>body{font-family:Arial;margin:20px;background:#0b1020;color:#eef} .grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px} .card{background:#16203a;padding:12px;border-radius:8px} button{padding:8px 12px} pre{background:#111a30;padding:10px;border-radius:8px;max-height:240px;overflow:auto} input,textarea{width:100%;background:#0f1630;color:#eef;border:1px solid #334;padding:8px;border-radius:6px}</style>
</head><body>
<h1>Genoa SPLAT Sidecar</h1>
<div class='grid'>
<div class='card'><h3>Health</h3><div id='health'>-</div></div>
<div class='card'><h3>Total Runs</h3><div id='total'>0</div></div>
<div class='card'><h3>Success Rate</h3><div id='success'>0%</div></div>
<div class='card'><h3>Avg Runtime</h3><div id='avg'>0s</div></div>
</div>
<h2>Run SPLAT</h2>
<label>JSON Payload</label>
<textarea id='payload' rows='10'>{"tx_qth":"sample_data/wnju-dt.qth","flags":["-metric"]}</textarea><br><br>
<button onclick='runJob()'>Run</button>
<pre id='out'></pre>
<script>
async function refresh(){
  const h=await fetch('/healthz').then(r=>r.json()).catch(()=>({status:'down'}));
  document.getElementById('health').textContent=h.status;
  const s=await fetch('/api/v1/stats').then(r=>r.json()).catch(()=>null);
  if(!s) return;
  total.textContent=s.total_runs; success.textContent=(s.success_rate*100).toFixed(1)+'%'; avg.textContent=s.avg_runtime_seconds.toFixed(2)+'s';
}
async function runJob(){
  let body; try{body=JSON.parse(payload.value);}catch(e){out.textContent='Invalid JSON';return;}
  const r=await fetch('/api/v1/splat/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  out.textContent=JSON.stringify(await r.json(),null,2); refresh();
}
refresh(); setInterval(refresh,5000);
</script></body></html>
